# PAC 2026 partition pick & place — one place for every setting.
# Paths are relative to this file. Values marked "ON SITE" must be measured/checked with the real PiPER.

camera:
  # picked by serial (pyrealsense2's, not the USB one lsusb shows); depth is aligned to colour
  top:                          # D435i over the table
    serial: "261822074796"
    color_size: [1280, 720]
    depth_size: [848, 480]
    fps: 30
  wrist:                        # D405 on the gripper — depth and colour MUST share one size
    serial: "261122276195"
    color_size: [848, 480]
    depth_size: [848, 480]
    fps: 30
  depth_frames: 10              # frames averaged (median) per depth capture
  profile: camera_profile.yaml  # grey-card exposure/WB per camera (perception-main/gray_card_calib.py)
  # offline --depth raw Z16 dumps (old V4L2 capture, D435i, not aligned to colour)
  offline_depth_size: [848, 480]
  offline_depth_unit_m: 0.001   # D435i 1 mm (the D405 is 0.1 mm; live code reads the scale itself)

models:
  vggt: facebook/VGGT-1B-Commercial
  grounding_dino: IDEA-Research/grounding-dino-base
  sam2: facebook/sam2.1-hiera-large
  rfdetr_weights: ../perception-main/ai_bubble/output/checkpoint_best_total.pth
  rfdetr_resolution: 768
  cell_classifier: ../perception-main/ai_failure/model/cell_classifier.joblib

perception:
  block_threshold: 0.5          # RF-DETR score for a bubble-wrap block
  cell_min_conf: 0.7            # below -> "uncertain"
  cell_min_visible: 0.9         # cell fraction inside the frame, else "out_of_view"
  # basket: rows / cols / wall height are measured in every scan (the basket differs between runs).
  # Only to force a known basket, uncomment:
  # basket: {rows: 2, cols: 2, wall_height_m: 0.055}

robot:
  type: mock                    # mock | piper
  can_port: can0
  speed_percent: 30
  tcp_offset_m: 0.1286          # reported end pose (link6 frame) -> closed finger tips; ruler 90 mm from the mount face + ~35 mm link6->mount; hand-eye 128.6 mm (2026-10-09)
  down_rpy_deg: [180.0, 0.0, 0.0]   # flange orientation for a top-down grasp (ON SITE)
  gripper_open_mm: 95            # gripper stroke 100 mm (max_range_config), block 80 mm
  gripper_effort: 1000          # 0..5000 = 0..5 N·m
  holding_min_mm: 10            # closed width above this = something between the fingers
  mock_fail_rate: 0.0           # mock only: chance that a grasp misses (to exercise retries)

calibration:
  file: calib/pixel_to_robot.json   # homography colour px -> robot XY (m) on the table plane
  table_z_robot_m: 0.0              # table surface height in the robot base frame (ON SITE)

motion:
  block_height_m: 0.04
  safe_margin_m: 0.05           # extra clearance above the box rim while moving
  lift_m: 0.05                  # lift after closing the gripper, then check the grasp
  grasp_depth_m: 0.015          # finger tips this far below the block top
  release_above_floor_m: 0.01   # block bottom this far above the cell floor when released

retry:
  pick: 3
  place: 3

run:
  max_blocks: 5
  log_dir: runs
